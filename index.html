  :root{
    --icon: 20px;
    --gray: #536471;
    --pink: #f91880; /* X like pink */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; background:#fff; color:#0f1419;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{display:grid; gap:112px; justify-items:center}
  .controls{margin-top:72px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:13px; color:var(--gray)}
  .seg{display:inline-flex; border:1px solid #cfd9de; border-radius:999px; overflow:hidden}
  .seg button{all:unset; cursor:pointer; padding:6px 14px; font-size:13px}
  .seg button[aria-pressed="true"]{background:#0f1419; color:#fff}
  .seg button:focus-visible{outline:2px solid #1d9bf0; outline-offset:-2px}
  .hint{font-size:12px; color:#8b98a5; margin-top:-92px}

  /* ---------- like button ---------- */
  .like{
    all:unset; cursor:pointer; display:inline-flex; align-items:center;
    gap:calc(var(--icon) * .28);
    color:var(--gray); position:relative; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .iconbox{position:relative; width:var(--icon); height:var(--icon); flex:none}
  .halo{
    position:absolute; inset:calc(var(--icon) * -.24); border-radius:50%;
    background:rgba(249,24,128,.1); opacity:0; transform:scale(.7);
    transition:opacity .25s, transform .35s cubic-bezier(.2,1.3,.4,1);
  }
  @media (hover:hover){ .like:hover .halo{opacity:1; transform:scale(1)} .like:hover{color:var(--pink)} }
  .like:focus-visible .halo{opacity:1; transform:scale(1); outline:2px solid #1d9bf0}

  .press{position:absolute; inset:0; will-change:transform}
  .layer{position:absolute; inset:0; will-change:transform,opacity}

  .outline svg{width:100%; height:100%; display:block; overflow:visible}
  .outline path{fill:none; stroke:currentColor; stroke-width:3.8; stroke-linejoin:round}

  .mandala{inset:-6%; opacity:0}
  .mandala svg{width:100%; height:100%; display:block; overflow:visible}
  .mandala ellipse, .mandala circle{transform-box:fill-box}

  /* mesh-gradient heart (SwiftUI MeshGradient feel) */
  .heartwrap{opacity:0; filter:drop-shadow(0 calc(var(--icon)*.04) calc(var(--icon)*.12) rgba(255,110,40,.32))}
  .heart{
    position:absolute; inset:0; overflow:hidden;
    -webkit-mask:var(--heart) center/100% 100% no-repeat; mask:var(--heart) center/100% 100% no-repeat;
  }
  /* rangoli palette laid out like a mesh: yellow, orange, magenta, purple, teal */
  .mesh{
    position:absolute; inset:-50%;
    background:linear-gradient(150deg, #ffc400 30%, #ff7a00 42%, #ff2d87 52%, #9b30ff 62%, #00b8a3 72%);
  }
  .blob{
    position:absolute; width:72%; height:72%; border-radius:50%;
    margin:-36% 0 0 -36%; will-change:transform;
  }
  .b1{left:33%; top:33%; background:radial-gradient(circle, #ffd21f 0, rgba(255,210,31,0) 66%)}
  .b2{left:67%; top:35%; background:radial-gradient(circle, #ff1f8f 0, rgba(255,31,143,0) 66%)}
  .b3{z-index:1; left:46%; top:50%; background:radial-gradient(circle, #ff8a00 0, rgba(255,138,0,0) 62%)}
  .b4{left:63%; top:60%; background:radial-gradient(circle, #8a3cff 0, rgba(138,60,255,0) 66%)}
  .b5{left:42%; top:68%; background:radial-gradient(circle, rgba(0,194,174,.9) 0, rgba(0,194,174,0) 48%)}
  .gloss{
    position:absolute; inset:0; z-index:2;
    background:radial-gradient(ellipse 34% 22% at 32% 26%, rgba(255,255,255,.5), rgba(255,255,255,0) 100%);
  }
  .ring{
    position:absolute; inset:-55%; border-radius:50%; opacity:0;
    background:conic-gradient(#e6007e, #ff7a00, #ffc400, #00b8a3, #7b2ff7, #e6007e);
    -webkit-mask:radial-gradient(circle, transparent 60%, #000 62%, #000 68%, transparent 70%);
            mask:radial-gradient(circle, transparent 60%, #000 62%, #000 68%, transparent 70%);
  }
  .fx{position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none}
  .fx i{position:absolute; display:block; will-change:transform,opacity}

  /* resting states */
  .like[data-liked="true"]{color:var(--pink)}
  .like[data-liked="true"] .outline{opacity:0}
  .like[data-liked="true"] .heartwrap{opacity:1}

  /* ---------- count: SwiftUI .numericText() style ---------- */
  .count{
    font-family:"TwitterChirp", "ChirpAlt", -apple-system, BlinkMacSystemFont, sans-serif;
    display:inline-flex; font-size:calc(var(--icon) * .68); line-height:1;
    font-variant-numeric:tabular-nums; letter-spacing:-.01em;
    transition:color .3s;
  }
  .d{position:relative; display:inline-block}
  .d .v{display:inline-block}
  .d .v.abs{position:absolute; left:0; top:0}
</style>
</head>
<body>
<main class="page">
  <button class="like" id="like" aria-pressed="false" aria-label="Like" data-liked="false">
    <span class="iconbox">
      <span class="halo"></span>
      <span class="press" id="press">
        <span class="layer outline" id="outline">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 40 C9 30 5.5 23 5.5 17 C5.5 11.8 9.5 8 14.2 8 C18.2 8 21.8 10.4 24 14.2 C26.2 10.4 29.8 8 33.8 8 C38.5 8 42.5 11.8 42.5 17 C42.5 23 39 30 24 40Z"/></svg>
        </span>
        <span class="layer mandala" id="mandala">
          <span class="layer" id="spin"><svg viewBox="0 0 48 48" aria-hidden="true"><g id="mG"></g></svg></span>
        </span>
        <span class="layer ring" id="ring"></span>
        <span class="layer heartwrap" id="heartwrap">
          <span class="heart"><span class="mesh" id="mesh"></span><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span><span class="blob b5"></span><span class="gloss"></span></span>
        </span>
      </span>
      <span class="fx" id="fx"></span>
    </span>
    <span class="count" id="count" aria-live="polite"></span>
  </button>

  <div class="controls">
    <div class="seg" id="speedSeg" role="group" aria-label="Speed">
      <button data-v="1" aria-pressed="true">1×</button>
      <button data-v="4" aria-pressed="false">Slow-mo</button>
    </div>
    <div class="seg" id="sizeSeg" role="group" aria-label="Size">
      <button data-v="20" aria-pressed="true">Actual</button>
      <button data-v="96" aria-pressed="false">Zoom</button>
    </div>
  </div>
  <div class="hint">Tap the heart. Tap again to unlike.</div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const btn = $('like'), press = $('press'), outline = $('outline'), mandala = $('mandala'),
        spin = $('spin'), ring = $('ring'), heartwrap = $('heartwrap'), mesh = $('mesh'),
        fx = $('fx'), countEl = $('count');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let S = 1, liked = false, n = 554;

  /* heart mask */
  const HEART = 'M24 42 C8 31 3.5 23 3.5 16.5 C3.5 10.5 8 6 13.8 6 C18.4 6 22 8.6 24 12.4 C26 8.6 29.6 6 34.2 6 C40 6 44.5 10.5 44.5 16.5 C44.5 23 40 31 24 42Z';
  document.documentElement.style.setProperty('--heart',
    `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='${HEART}'/></svg>`)}")`);

  /* ---------- SwiftUI-style spring → CSS linear() easing ----------
     spring(response, dampingFraction) matches SwiftUI's .spring(response:dampingFraction:) */
  const LINEAR_OK = CSS.supports('animation-timing-function', 'linear(0, 1)');
  const cache = {};
  function spring(response, damping){
    const key = response + '|' + damping;
    if (cache[key]) return cache[key];
    const w0 = 2 * Math.PI / response;
    const f = damping < 1
      ? (t => { const wd = w0 * Math.sqrt(1 - damping * damping);
                return 1 - Math.exp(-damping * w0 * t) * (Math.cos(wd * t) + (damping * w0 / wd) * Math.sin(wd * t)); })
      : (t => 1 - Math.exp(-w0 * t) * (1 + w0 * t));
    let T = 0;
    for (let t = 0; t < 4; t += 0.004) if (Math.abs(1 - f(t)) > 0.0015) T = t;
    T += 0.004;
    const N = Math.min(90, Math.max(24, Math.round(T * 70)));
    const pts = [];
    for (let i = 0; i <= N; i++) pts.push(i === N ? 1 : +f(T * i / N).toFixed(4));
    return cache[key] = {
      easing: LINEAR_OK ? `linear(${pts.join(',')})` : (damping < .8 ? 'cubic-bezier(.3,1.45,.45,1)' : 'cubic-bezier(.2,.9,.3,1)'),
      duration: T * 1000
    };
  }
  const EASE_OUT = 'cubic-bezier(.16,1,.3,1)';   // iOS-like expo-out
  const EASE_IN  = 'cubic-bezier(.4,0,.9,.6)';

  function anim(el, frames, timing){
    const t = timing.spring ? { ...spring(...timing.spring) } : { duration: timing.duration, easing: timing.easing || EASE_OUT };
    return el.animate(frames, {
      duration: (reduce ? 1 : t.duration * S),
      easing: t.easing,
      delay: (reduce ? 0 : (timing.delay || 0) * S),
      fill: timing.fill || 'both',
      composite: timing.composite || 'replace',
      iterations: (reduce ? 1 : timing.iterations || 1)
    });
  }

  /* ---------- mandala (original design: petals pop one by one in build order) ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const mG = $('mG');
  const petals = [];
  let idx = 0;
  function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
  function addPetal(node, order, dx, dy, popIndex){
    node.style.transformOrigin = 'center'; node.style.opacity = 0;
    petals.push({ el: node, order, dx, dy, pop: popIndex });
  }
  function ring_(count, r, rx, ry, colors, offset, order){
    for (let i = 0; i < count; i++){
      const g = el('g', { transform: `rotate(${i * 360 / count + offset} 24 24)` }, mG);
      addPetal(el('ellipse', { cx: 24, cy: 24 - r, rx, ry, fill: colors[i % colors.length] }, g), order, 0, r, idx++);
    }
  }
  ring_(12, 15.5, 3.4, 5.6, ['#e6007e', '#ff7a00'], 0, 3);
  ring_(12, 15.5, 1.1, 1.1, ['#ffc400'], 15, 4);
  ring_(8, 10, 3.1, 4.6, ['#ffc400', '#7a2ff7'], 22.5, 2);
  ring_(8, 5.8, 2.2, 3.2, ['#ffffff', '#00a99d'], 0, 1);
  addPetal(el('circle', { cx: 24, cy: 24, r: 2.8, fill: '#e6007e' }, mG), 0, 0, 0, idx++);
  addPetal(el('circle', { cx: 24, cy: 24, r: 1.2, fill: '#ffc400' }, mG), 0, 0, 0, idx++);
  for (let i = 0; i < 24; i++){
    const a = i * Math.PI / 12, x = 24 + Math.cos(a) * 20.4, y = 24 + Math.sin(a) * 20.4;
    addPetal(el('circle', { cx: x, cy: y, r: .85, fill: i % 2 ? '#ff7a00' : '#7a2ff7' }, mG), 5, 24 - x, 24 - y, (idx++) % 24);
  }

  /* ---------- count: per-digit roll with blur (SwiftUI .contentTransition(.numericText())) ---------- */
  function renderCount(v){
    countEl.innerHTML = '';
    String(v).split('').forEach(ch => { const d = document.createElement('span'); d.className = 'd'; d.innerHTML = `<span class="v">${ch}</span>`; countEl.appendChild(d); });
  }
  function rollCount(from, to){
    const a = String(from), b = String(to);
    if (a.length !== b.length){ renderCount(to); return; }
    const dir = to > from ? 1 : -1;
    const digits = countEl.querySelectorAll('.d');
    let k = 0;
    for (let i = 0; i < b.length; i++){
      if (a[i] === b[i]) continue;
      const d = digits[i];
      d.querySelectorAll('.v.abs').forEach(x => x.remove());
      const old = d.querySelector('.v');
      const neu = document.createElement('span'); neu.className = 'v'; neu.textContent = b[i];
      old.classList.add('abs'); d.appendChild(neu);
      const delay = k++ * 30;
      anim(old, [
        { transform: 'translateY(0) scale(1)', opacity: 1, filter: 'blur(0)' },
        { transform: `translateY(${-70 * dir}%) scale(.7)`, opacity: 0, filter: 'blur(2.5px)' }
      ], { spring: [.38, 1], delay }).onfinish = () => old.remove();
      anim(neu, [
        { transform: `translateY(${70 * dir}%) scale(.7)`, opacity: 0, filter: 'blur(2.5px)' },
        { transform: 'translateY(0) scale(1)', opacity: 1, filter: 'blur(0)' }
      ], { spring: [.42, .78], delay });
    }
  }

  /* ---------- particles ---------- */
  const COLORS = ['#e6007e', '#ff7a00', '#ffc400', '#00b8a3', '#7b2ff7', '#ff2d87'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const PAL = ['#e6007e', '#ff7a00', '#ffc400', '#00a99d', '#7a2ff7', '#ffffff'];
  function petalConfetti(){
    if (reduce) return;
    const size = press.getBoundingClientRect().width;
    const N = 20;
    for (let i = 0; i < N; i++){
      const p = document.createElement('i');
      const d = size * rnd(.07, .16);
      p.style.cssText = `width:${d}px;height:${d}px;left:${-d/2}px;top:${-d/2}px;background:${PAL[i % PAL.length]};border-radius:50% 0 50% 0;opacity:0`;
      fx.appendChild(p);
      const ang = (i / N) * Math.PI * 2 + rnd(-.2, .2), dist = size * rnd(.75, 1.15);
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = rnd(-180, 180);
      anim(p, [
        { transform: 'translate(0px,0px) scale(.3) rotate(0deg)', opacity: 0 },
        { transform: 'translate(0px,0px) scale(.3) rotate(0deg)', opacity: 1, offset: .02 },
        { transform: `translate(${dx * .7}px,${dy * .7}px) scale(1) rotate(${rot * .6}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${dx}px,${dy + size * .1}px) scale(.2) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: rnd(650, 1000), delay: 260 + rnd(0, 120), easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
    }
  }

  function burst(delay){
    if (reduce) return;
    const size = press.getBoundingClientRect().width;
    const N = 10;
    for (let i = 0; i < N; i++){
      const p = document.createElement('i');
      const d = size * (i % 3 === 0 ? .14 : .09);
      const diamond = i % 2 === 0;
      p.style.cssText = `width:${d}px;height:${d}px;left:${-d/2}px;top:${-d/2}px;background:${COLORS[i % COLORS.length]};border-radius:${diamond ? '2px' : '50%'};opacity:0`;
      fx.appendChild(p);
      const a = (i / N) * Math.PI * 2 + rnd(-.15, .15) - Math.PI / 2;
      const r1 = size * rnd(.58, .7), r2 = size * rnd(.85, 1.05);
      const rot = diamond ? 45 : 0;
      anim(p, [
        { transform: `translate(${Math.cos(a) * r1 * .55}px,${Math.sin(a) * r1 * .55}px) rotate(${rot}deg) scale(.2)`, opacity: 0 },
        { transform: `translate(${Math.cos(a) * r1}px,${Math.sin(a) * r1}px) rotate(${rot + 60}deg) scale(1)`, opacity: 1, offset: .35 },
        { transform: `translate(${Math.cos(a) * r2}px,${Math.sin(a) * r2 + size * .08}px) rotate(${rot + 140}deg) scale(0)`, opacity: .8 }
      ], { duration: rnd(620, 820), delay: delay + rnd(0, 40), easing: EASE_OUT }).onfinish = () => p.remove();
    }
  }

  /* ---------- choreography ---------- */
  const blobs = [...document.querySelectorAll('.blob')];
  const stack = [outline, mandala, spin, ring, heartwrap, mesh, ...blobs, ...petals.map(p => p.el)];

  /* fluid colour flow: each blob wanders its own slow loop, base sweep rotates underneath */
  const PATHS = [
    [[0,0],[22,14],[8,30],[-14,10]],
    [[0,0],[-24,18],[-6,-10],[12,22]],
    [[0,0],[18,-16],[-20,-8],[-6,20]],
    [[0,0],[-22,-20],[10,-26],[16,8]],
    [[0,0],[26,-12],[6,-30],[-18,-6]]
  ];
  const PERIODS = [5200, 6100, 4700, 6800, 5600];
  function startFlow(delay){
    if (reduce) return;
    blobs.forEach((b, i) => {
      const pts = PATHS[i].concat([PATHS[i][0]]);
      anim(b, pts.map(([x, y], k) => ({ transform: `translate(${x}%,${y}%) scale(${k % 2 ? 1.12 : 1})`, easing: 'cubic-bezier(.45,0,.55,1)' })),
        { duration: PERIODS[i], delay, easing: 'linear', fill: 'none', iterations: Infinity });
    });
    anim(mesh, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }],
      { duration: 16000, delay: delay + 900, easing: 'linear', fill: 'none', iterations: Infinity });
  }
  const stopAll = () => stack.forEach(e => e.getAnimations().forEach(a => a.cancel()));

  function playLike(){
    stopAll();
    // 1. outline heart pops out (zooms up), then hands off to the mandala
    anim(outline, [
      { transform: 'scale(1)', opacity: 1, easing: 'cubic-bezier(.2,.8,.3,1)' },
      { transform: 'scale(1.32)', opacity: 1, offset: .55, easing: 'cubic-bezier(.5,0,.9,.5)' },
      { transform: 'scale(1.15)', opacity: 0 }
    ], { duration: 260, easing: 'linear' });

    // 2. mandala pops in (springy zoom), spins slowly, petals pop one by one, petal confetti flies out
    const SPIN_MS = 1300, spinAt = t => -40 + 100 * Math.min(t, SPIN_MS) / SPIN_MS;
    anim(mandala, [{ opacity: 0 }, { opacity: 1 }], { duration: 110, delay: 120, easing: 'linear' });
    anim(mandala, [{ transform: 'scale(.45)' }, { transform: 'scale(1)' }], { spring: [.45, .55], delay: 120 });
    anim(spin, [{ transform: 'rotate(-40deg)' }, { transform: 'rotate(60deg)' }], { duration: SPIN_MS, easing: 'linear' });
    petals.forEach(({ el, pop }) => {
      anim(el, [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
        { duration: 380, delay: 160 + pop * 14, easing: 'cubic-bezier(.2,1.6,.4,1)' });
    });
    petalConfetti();

    // 3. backwash: the mandala recedes into the heart like a wave pulling back — outer rings lead
    const T = 1080, WASH = 'cubic-bezier(.45,0,.25,1)';
    anim(spin, [{ transform: `rotate(${spinAt(T)}deg)` }, { transform: `rotate(${spinAt(T) + 28}deg)` }],
      { duration: 420, delay: T, easing: 'cubic-bezier(.3,.3,.4,1)', fill: 'forwards' });
    anim(mandala, [
      { transform: 'scale(1)', opacity: 1 },
      { transform: 'scale(.6)', opacity: 1, offset: .65 },
      { transform: 'scale(.42)', opacity: 0 }
    ], { duration: 420, delay: T, easing: WASH, fill: 'forwards' });
    petals.forEach(({ el, order, dx, dy }) => {
      anim(el, [
        { transform: 'translate(0px,0px) scale(1)', opacity: 1 },
        { transform: `translate(${dx * .35}px,${dy * .35}px) scale(.6)`, opacity: 0 }
      ], { duration: 340, delay: T + (5 - order) * 22, easing: WASH, fill: 'forwards' });
    });

    // gradient heart rises out of the receding mandala and settles with a soft spring
    anim(heartwrap, [{ opacity: 0 }, { opacity: 1 }], { duration: 180, delay: T + 110, easing: 'linear' });
    anim(heartwrap, [{ transform: 'scale(.5)' }, { transform: 'scale(1)' }], { spring: [.5, .68], delay: T + 110 });
    anim(mesh, [{ transform: 'rotate(-120deg) scale(1.12)' }, { transform: 'rotate(0deg) scale(1)' }],
      { duration: 1200, delay: T, easing: EASE_OUT });

    anim(ring, [{ opacity: .7, transform: 'scale(.55)' }, { opacity: 0, transform: 'scale(1.1)' }],
      { duration: 520, delay: T + 260, easing: EASE_OUT, fill: 'forwards' });
    burst(T + 280);
    startFlow(T + 300);
  }

  function playUnlike(){
    stopAll();
    anim(heartwrap, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.4)' }], { duration: 180, easing: EASE_IN });
    anim(outline, [{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'scale(1)', offset: .2 }, { opacity: 1, transform: 'scale(1)' }],
      { spring: [.42, .55], delay: 90 });
  }

  /* press feedback (iOS button squish) */
  let pressAnim;
  const squish = to => {
    if (reduce) return;
    const from = getComputedStyle(press).transform;
    pressAnim && pressAnim.cancel();
    pressAnim = anim(press, [{ transform: from === 'none' ? 'scale(1)' : from }, { transform: `scale(${to})` }], to < 1 ? { spring: [.25, .9] } : { spring: [.4, .5] });
  };
  btn.addEventListener('pointerdown', () => squish(.84));
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => btn.addEventListener(e, () => squish(1)));

  btn.addEventListener('click', () => {
    const prev = n;
    liked = !liked;
    n += liked ? 1 : -1;
    btn.dataset.liked = liked;
    btn.setAttribute('aria-pressed', liked);
    rollCount(prev, n);
    if (navigator.vibrate) navigator.vibrate(8);
    liked ? playLike() : playUnlike();
  });

  /* ---------- demo controls ---------- */
  function seg(id, fn){
    const box = $(id);
    box.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      fn(b.dataset.v);
    });
  }
  seg('speedSeg', v => { S = +v; });
  seg('sizeSeg', v => document.documentElement.style.setProperty('--icon', v + 'px'));

  renderCount(n);
})();
</script>
</body>
</html>
